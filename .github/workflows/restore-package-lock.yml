name: restore-package-lock
on:
  push:
    branches:
      - cursor/restore-lockfile-c1ed
    paths:
      - ".cursor-sync/payloads/manifest.json"
      - ".cursor-sync/payloads/fixes.json"
      - "scripts/restore_package_lock.py"
      - ".github/workflows/restore-package-lock.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cursor/restore-lockfile-c1ed
          fetch-depth: 0
      - name: Restore package-lock.json
        run: python3 scripts/restore_package_lock.py
      - name: Commit lock onto main
        run: |
          cp package-lock.json /tmp/package-lock.restored.json
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/package-lock.restored.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 1
          fi
          git commit -m "fix: security hygiene — drop unused deps, CI scanners, static theme boot"
          git push origin main
