name: restore-package-lock
on:
  workflow_dispatch:
  push:
    paths:
      - ".cursor-sync/payloads/**"
      - ".github/workflows/restore-package-lock.yml"
      - "scripts/restore_package_lock.py"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore package-lock.json
        run: python3 scripts/restore_package_lock.py
      - name: Commit restored lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: regenerate package-lock.json without opencc-js for npm ci"
          git push
      - name: Cleanup restore helpers
        if: success()
        run: |
          rm -rf .cursor-sync/payloads
          rm -f scripts/restore_package_lock.py
          rm -f .github/workflows/restore-package-lock.yml
          rmdir .cursor-sync 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to cleanup"
            exit 0
          fi
          git commit -m "chore: remove temporary package-lock restore helpers"
          git push
