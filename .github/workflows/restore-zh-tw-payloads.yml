name: restore-zh-tw-payloads
on:
  workflow_dispatch:
  push:
    paths:
      - ".cursor-sync/payloads/**"
      - ".github/workflows/restore-zh-tw-payloads.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore payloads
        run: python3 scripts/restore_zh_tw_payloads.py
      - name: Commit restored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ziwei/cities.ts app/page.tsx || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(i18n): restore zh-TW cities.ts and app/page.tsx from payloads"
            git push
          fi
